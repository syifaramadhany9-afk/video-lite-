<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoLite</title><style>body{background:#000;color:#fff;font-family:system-ui;padding:20px;text-align:center}video{width:100%;max-width:600px;border-radius:12px;margin:20px 0}button{background:#ff0050;color:#fff;border:0;padding:14px 24px;border-radius:10px;font-size:16px;font-weight:700}</style></head><body><h1>🎬 VideoLite AKTIF!</h1><p>Tap untuk pilih video</p><input type="file" id="f" accept="video/*"><br><video id="v" controls playsinline></video><br><button onclick="document.getElementById('v').play()">PLAY</button><script>document.getElementById('f').onchange=e=>{document.getElementById('v').src=URL.createObjectURL(e.target.files[0])}</script></body></html>
