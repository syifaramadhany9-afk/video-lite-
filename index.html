<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff0050">
<title>VideoLite PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#111;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{font-weight:800;font-size:18px}.logo span{color:#ff0050}
.btn{background:#ff0050;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-weight:700}
main{flex:1;max-width:800px;margin:0 auto;width:100%;padding:12px;display:flex;flex-direction:column;gap:12px}
.player-wrap{background:#0a0a0a;border-radius:16px;overflow:hidden;aspect-ratio:9/16;max-height:60vh;margin:0 auto;width:100%;max-width:400px;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000}
.ctrl,.timeline{background:#111;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;overflow-x:auto}
.chip{background:#222;padding:10px 16px;border-radius:20px;font-size:13px;border:1px solid #333;color:#fff}
.chip.active{background:#ff0050;border-color:#ff0050}
input[type=range]{width:100%;accent-color:#ff0050}
.label{font-size:12px;color:#888;display:flex;justify-content:space-between}
.banner{background:linear-gradient(90deg,#ff0050,#ff7a00);padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
</style>
</head>
<body>
<header><div class="logo">🎬 <span>Video</span>Lite PRO</div><button class="btn">EXPORT</button></header>
<main>
<div class="banner">📲 Bisa di-Install di HP <button onclick="alert('Cara install: titik 3 kanan atas > Tambahkan ke Layar Utama')" style="background:#fff;color:#000;border:0;padding:6px 12px;border-radius:20px;font-weight:700">Install</button></div>
<div class="player-wrap"><div id="ph" style="text-align:center;color:#666"><p style="font-size:40px">🎬</p><p>Pilih Video</p><input type="file" id="file" accept="video/*" style="margin-top:12px"></div><video id="v" playsinline controls style="display:none"></video></div>
<div class="ctrl"><div class="label"><span>TRIM START</span><span id="sVal">0s</span></div><input type="range" id="s" min="0" max="100" value="0" step="0.1"><div class="label"><span>TRIM END</span><span id="eVal">0s</span></div><input type="range" id="e" min="0" max="100" value="100" step="0.1"><div class="row"><button class="chip active" onclick="playTrim()">▶️ Play Trim</button><button class="chip" onclick="v.pause()">⏸️ Pause</button></div></div>
<div class="timeline"><div class="label" style="margin-bottom:8px">FILTER</div><div class="row" id="filters"></div></div>
<div class="timeline"><div class="label">SPEED</div><div class="row"><button class="chip" onclick="v.playbackRate=0.5">0.5x</button><button class="chip active" onclick="v.playbackRate=1">1x</button><button class="chip" onclick="v.playbackRate=1.5">1.5x</button><button class="chip" onclick="v.playbackRate=2">2x</button></div></div>
</main>
<script>
const v=document.getElementById('v'),file=document.getElementById('file'),ph=document.getElementById('ph'),s=document.getElementById('s'),e=document.getElementById('e'),sVal=document.getElementById('sVal'),eVal=document.getElementById('eVal');
const filters=[['Normal','none'],['BW','grayscale(100%)'],['Sepia','sepia(100%)'],['Vivid','contrast(140%) brightness(110%) saturate(140%)'],['Dark','brightness(70%)']];
const fWrap=document.getElementById('filters');
filters.forEach(([n,val])=>{let b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{v.style.filter=val;document.querySelectorAll('#filters.chip').forEach(c=>c.classList.remove('active'));b.classList.add('active')};if(n=='Normal')b.classList.add('active');fWrap.appendChild(b);});
file.onchange=ev=>{let f=ev.target.files[0];if(!f)return;v.src=URL.createObjectURL(f);v.style.display='block';ph.style.display='none';v.onloadedmetadata=()=>{s.max=v.duration;e.max=v.duration;e.value=v.duration;eVal.textContent=v.duration.toFixed(1)+'s';}};
s.oninput=()=>sVal.textContent=parseFloat(s.value).toFixed(1)+'s';
e.oninput=()=>eVal.textContent=parseFloat(e.value).toFixed(1)+'s';
function playTrim(){v.currentTime=parseFloat(s.value);v.play();let iv=setInterval(()=>{if(v.currentTime>=parseFloat(e.value)){v.pause();clearInterval(iv);}},80);}
</script>
</body>
</html>
